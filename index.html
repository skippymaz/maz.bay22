<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Landing Page</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #002050;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 60px 20px;
            overflow-x: hidden;
        }

        /* --- Google Section Styles --- */
        .search-container {
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 50px;
        }

        .google-logo {
            font-family: Arial, sans-serif;
            font-size: 80px;
            font-weight: 400;
            letter-spacing: -2px;
            color: #ffffff;
            margin-bottom: 30px;
            user-select: none;
        }

        .search-bar-wrapper {
            position: relative;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            height: 52px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            transition: box-shadow 0.3s ease;
        }

        .search-bar-wrapper:focus-within {
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3);
        }

        .search-bar-wrapper .search-icon {
            color: #5f6368;
            width: 18px;
            height: 18px;
            margin-right: 14px;
            flex-shrink: 0;
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            color: #202124;
            background: transparent;
            font-family: 'Segoe UI', sans-serif;
        }

        .search-input::placeholder {
            color: #5f6368;
        }

        .search-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-action-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #5f6368;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
        }

        .search-action-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .ai-mode-btn {
            background-color: #f1f3f4;
            color: #202124;
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background-color 0.2s;
            text-decoration: none;
        }

        .ai-mode-btn:hover {
            background-color: #e2e5e8;
        }

        .ai-mode-btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        /* --- Windows 8 Metro Style Tiles --- */
        .metro-section {
            width: 100%;
            max-width: 900px;
        }

        .metro-title {
            font-size: 20px;
            font-weight: 300;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
            color: #e0e0e0;
        }

        .metro-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            grid-auto-rows: 130px;
            grid-gap: 12px;
        }

        .tile {
            position: relative;
            background-color: #0078d7;
            text-decoration: none;
            color: #ffffff;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 2px solid transparent;
            transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .tile:hover {
            transform: scale(1.03);
            border-color: #ffffff;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            z-index: 2;
        }

        .tile:active {
            transform: scale(0.98);
        }

        /* Tile Sizes */
        .tile.wide {
            grid-column: span 2;
        }

        .tile.large {
            grid-column: span 2;
            grid-row: span 2;
        }

        /* Tile Contents */
        .tile-icon {
            font-size: 26px;
            align-self: flex-start;
        }

        .tile-icon svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
        }

        .tile.large .tile-icon svg {
            width: 40px;
            height: 40px;
        }

        .tile-label {
            font-size: 14px;
            font-weight: 600;
            word-break: break-word;
        }

        .tile.large .tile-label {
            font-size: 18px;
        }

        /* Metro Color Palette Variants */
        .bg-blue { background-color: #0078d7; }
        .bg-teal { background-color: #00aba9; }
        .bg-purple { background-color: #603cba; }
        .bg-magenta { background-color: #d81b60; }
        .bg-orange { background-color: #da532c; }
        .bg-green { background-color: #107c10; }
        .bg-dark { background-color: #2d2d2d; }
        .bg-red { background-color: #e51400; }
    </style>
</head>
<body>

    <!-- Google Search & URL Bar Component -->
    <div class="search-container">
        <div class="google-logo">Google</div>
        <form class="search-bar-wrapper" action="https://www.google.com/search" method="get" id="searchForm">
            <!-- Search Icon SVG -->
            <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            
            <input type="text" class="search-input" name="q" placeholder="Search Google or type a URL" autocomplete="off" autofocus id="searchInput">
            
            <div class="search-actions">
                <button type="button" class="search-action-btn" title="Search by Voice">
                    <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                </button>
                <button type="button" class="search-action-btn" title="Search by Image">
                    <svg viewBox="0 0 24 24"><path d="M4 5h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zm8 14a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0-2a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/></svg>
                </button>
                <a href="https://gemini.google.com" target="_blank" class="ai-mode-btn">
                    <svg viewBox="0 0 24 24"><path d="M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5z"/></svg>
                    AI Mode
                </a>
            </div>
        </form>
    </div>

    <!-- Windows 8 Metro Style Links Grid -->
    <div class="metro-section">
        <div class="metro-title">Pinned Favorites</div>
        <div class="metro-grid">
            
            <a href="https://github.com" target="_blank" class="tile wide bg-dark">
                <div class="tile-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
                </div>
                <span class="tile-label">GitHub Repositories</span>
            </a>

            <a href="https://reddit.com" target="_blank" class="tile bg-orange">
                <div class="tile-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.221.688-.356 1.101-.356a1.85 1.85 0 0 1 1.85 1.85c0 1.023-.827 1.85-1.85 1.85-.924 0-1.688-.686-1.823-1.573-1.196.671-2.784 1.078-4.532 1.125l-.898 4.195c-.097.45-.484.777-.946.777-.551 0-.998-.447-.998-.998 0-.256.098-.49.264-.672l1.01-4.717c-1.848-.342-3.27-1.822-3.27-3.606 0-1.023.827-1.85 1.85-1.85.839 0 1.547.561 1.77 1.339 1.115-.558 2.457-.899 3.906-.948l.745-3.481.045-.015a1.25 1.25 0 0 1 1.498.922z"/></svg>
                </div>
                <span class="tile-label">Reddit</span>
            </a>

            <a href="https://youtube.com" target="_blank" class="tile bg-red">
                <div class="tile-icon">
                    <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                </div>
                <span class="tile-label">YouTube</span>
            </a>

            <a href="https://mail.google.com" target="_blank" class="tile large bg-teal">
                <div class="tile-icon">
                    <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-8V6l8 5 8-5v2z"/></svg>
                </div>
                <span class="tile-label">Gmail Inbox &amp; Workspace Mail</span>
            </a>

            <a href="https://wikipedia.org" target="_blank" class="tile bg-blue">
                <div class="tile-icon">
                    <svg viewBox="0 0 24 24"><path d="M12.09 13.52c.26-.81 1.19-3.71 1.54-4.83.18-.57.34-1.13.48-1.65-.25 0-.5.06-.75.18-.25.12-.55.33-.9  मुलांना... wait, let's use standard wiki globe icon... M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                </div>
                <span class="tile-label">Wikipedia</span>
            </a>

            <a href="https://news.google.com" target="_blank" class="tile bg-purple">
                <div class="tile-icon">
                    <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                </div>
                <span class="tile-label">Google News</span>
            </a>

            <a href="https://netflix.com" target="_blank" class="tile wide bg-magenta">
                <div class="tile-icon">
                    <svg viewBox="0 0 24 24"><path d="M16 0H8C3.58 0 0 3.58 0 8v8c0 4.42 3.58 8 8 8h8c4.42 0 8-3.58 8-8V8c0-4.42-3.58-8-8-8zm-2.05 17.81c-1.07-.31-2.15-.62-3.23-.93-.16-.05-.33.02-.38.17l-.52 1.54c-.05.15.02.33.17.38 1.07.31 2.15.62 3.23.93.16.05.33-.02.38-.17l.52-1.54c.05-.15-.02-.33-.17-.38zM14.5 13H9.5v-2h5v2z"/></svg>
                </div>
                <span class="tile-label">Netflix Streaming</span>
            </a>

            <a href="https://chatgpt.com" target="_blank" class="tile bg-green">
                <div class="tile-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93z"/></svg>
                </div>
                <span class="tile-label">ChatGPT</span>
            </a>

        </div>
    </div>

    <script>
        const searchForm = document.getElementById('searchForm');
        const searchInput = document.getElementById('searchInput');

        searchForm.addEventListener('submit', function(e) {
            const query = searchInput.value.trim();
            const isUrl = /^(https?:\/\/)?([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}(:\d+)?(\/.*)?$/.test(query) && !query.includes(' ');
            
            if (isUrl) {
                e.preventDefault();
                let finalUrl = query;
                if (!/^https?:\/\//i.test(finalUrl)) {
                    finalUrl = 'https://' + finalUrl;
                }
                window.location.href = finalUrl;
            }
        });
    </script>
</body>
</html>
